[project]
name = "comfyui-xiaohei"
version = "1.0.0"
description = "小黑工具箱：ComfyUI 自定义节点合集，126 个节点 / 24 个模块，覆盖视频、图像、音频、提示词与低显存优化。"
dependencies = [
    "opencv-python",
    "scenedetect",
    "rotary-embedding-torch",
    "imageio-ffmpeg",
]
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/XiaoHei-8G/Comfyui-XiaoHei"

[tool.comfy]
PublisherId = "xh666"
DisplayName = "Comfyui-XiaoHei"
Icon = ""

#  刻意【不】在这里写 web = "web"：
# 本包已用 __init__.py 的 WEB_DIRECTORY = "web" 注册前端扩展。
# 两处同时声明会让 ComfyUI 用两个不同的键注册同一个目录，js 有被加载两次的风险。
