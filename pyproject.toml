[project]
name = "comfyui-xiaohei"
version = "1.0.7"
description = "小黑工具箱：ComfyUI 自定义节点合集，126 个节点 / 24 个模块，覆盖视频、图像、音频、提示词与低显存优化。"
dependencies = [
    "opencv-python",
    "scenedetect",
    "rotary-embedding-torch",
    "imageio-ffmpeg",
]
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/XiaoHei-8G/Comfyui-XiaoHei"

[tool.comfy]
PublisherId = "xh666"
DisplayName = "Comfyui-XiaoHei"
Icon = ""
# comfy-cli 用 `git ls-files` 收集文件，git 默认把中文文件名转成八进制转义，
# zip_files 拿到转义串判 os.path.exists 为假，会打印 "File not found" 静默跳过。
# includes 走 os.walk 直接读文件系统，绕开转义问题，把音效库强制带进发布包。
# 1.0.0 的 Registry 包因此少了 35 个中文名 flac；1.0.1 起修好。
# 1.0.2 目录重构后前端目录由 web/ 改名为 js/，此路径必须跟着改，
# 否则下次发版（1.0.3）会重新静默丢掉全部 36 个中文名 flac。
includes = ["js/sounds"]

#  刻意【不】在这里写 web = "js"：
# 本包已用 __init__.py 的 WEB_DIRECTORY = "js" 注册前端扩展。
# 两处同时声明会让 ComfyUI 用两个不同的键注册同一个目录，js 有被加载两次的风险。
